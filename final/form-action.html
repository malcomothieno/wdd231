  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="index.html" class="logo" aria-label="GreenTrail Hub Home">
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
          <path d="M18 2 L34 30 L2 30 Z" fill="#F5F5F5" opacity="0.9"/>

      </button>
      <nav id="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="trails.html">Trails</a></li>
          <li><a href="join.html">Join a Hike</a></li>

          <h1>Registration Confirmed!</h1>
          <p class="confirm-sub">Here's a summary of your submission:</p>
          <dl class="confirm-data" id="confirmData">

          </dl>
          <div class="confirm-actions">
            <a href="trails.html" class="btn btn-outline">Browse More Trails</a>
            <a href="join.html" class="btn btn-primary">Register Another Hike</a>
          </div>
        </div>
      </div>

  <footer>

      <div class="footer-brand">
        <svg width="28" height="28" viewBox="0 0 36 36" aria-hidden="true">
